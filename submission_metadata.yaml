ai_usage_summary: |
  We used AI tools during development for implementation support,
  debugging assistance, and documentation review. Antigravity was used
  with Gemini and Claude models, and Codex extension usage is declared
  under Other. The ranking approach, evaluation decisions, signal design,
  testing, and final validation were handled by the OctaOps team.

methodology_summary: |
  We built an offline, deterministic three-stage candidate ranking pipeline. Stage 1 streams candidates through a hybrid scorer combining JD alignment, skill coverage, experience fit, production execution indicators, and verified career evidence extracted from candidate history. Evidence calibration reduces reliance on keyword-only matches and prioritizes demonstrated real-world relevance. A dynamic Stage 2 recall pool scales candidate selection before deeper evidence-based reranking, where career depth, behavioral signals, and profile quality are evaluated. Stage 3 generates deterministic candidate-specific reasoning explaining the final rankings. The system runs fully CPU-only without GPU inference, external APIs, or network access during ranking.

